name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: ruff + pytest (CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (base only — no GPU extras in CI)
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Pytest
        env:
          OPEN_GEOFM_REWRITER: local
        run: uv run pytest -q -m "not gpu and not slow"
