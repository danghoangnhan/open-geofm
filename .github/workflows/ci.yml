name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: ruff + pytest (CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps (formal + dev — no GPU extras in CI)
        # `--extra formal` brings in `formalgeo` (the FormalGeo7K loader +
        # FGPS searcher). Without it, every test file that imports
        # `open_geofm.formal.*` or `sampling.*` fails collection on
        # `ModuleNotFoundError: formalgeo`. The torch/train/eval extras stay
        # out of CI — those are the GPU phases.
        run: uv sync --extra formal --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Pytest
        env:
          OPEN_GEOFM_REWRITER: local
        run: uv run pytest -q -m "not gpu and not slow"
